<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS 独立全屏 App 关键配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>你画我猜出题器</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 16px;
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        .stats b {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .word-box {
            min-height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            border-radius: 12px;
            margin-bottom: 20px;
            padding: 16px;
            text-align: center;
        }

        .current-word {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text);
            word-break: break-word;
            line-height: 1.3;
        }

        .empty-hint {
            color: var(--text-sub);
            font-size: 1.1rem;
            font-weight: normal;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 14px 16px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            flex: 2;
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            opacity: 0.6;
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: var(--text);
            border: 1px solid var(--border);
            flex: 1;
        }

        .btn-fullscreen {
            background-color: #0f172a;
            color: #ffffff;
            width: 100%;
        }

        /* 设置面板 */
        details summary {
            font-weight: 600;
            cursor: pointer;
            color: var(--text-sub);
        }

        details[open] summary {
            margin-bottom: 12px;
            color: var(--text);
        }

        .textarea-box {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            resize: vertical;
            outline: none;
            margin-bottom: 10px;
        }

        .tip-text {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 10px;
        }

        .save-msg {
            color: #10b981;
            font-size: 0.9rem;
            margin-top: 8px;
            display: none;
            text-align: center;
        }

        /* ---------------- 真正全屏模式 ---------------- */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* 针对移动端动态地址栏适配 */
            background-color: #090d16;
            color: #ffffff;
            z-index: 99999;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: calc(env(safe-area-inset-top, 24px) + 12px) 20px calc(env(safe-area-inset-bottom, 20px) + 16px) 20px;
        }

        .fs-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            color: #94a3b8;
        }

        .fs-header b {
            color: #38bdf8;
            font-size: 1.25rem;
        }

        .fs-exit-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
        }

        .fs-word-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            text-align: center;
            padding: 10px 16px;
        }

        .fs-word {
            font-size: clamp(4.5rem, 18vw, 11rem);
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1.15;
            color: #ffffff;
            word-break: break-word;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
        }

        .fs-hint {
            font-size: clamp(1.8rem, 6vw, 3rem);
            color: #64748b;
            font-weight: normal;
        }

        .fs-controls {
            width: 100%;
            max-width: 550px;
            display: flex;
            gap: 14px;
        }

        .fs-btn-next {
            flex: 2;
            background-color: #38bdf8;
            color: #0f172a;
            font-size: 1.35rem;
            font-weight: 700;
            padding: 18px;
            border-radius: 14px;
        }

        .fs-btn-next:disabled {
            background-color: #334155;
            color: #64748b;
        }

        .fs-btn-reset {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: none;
            font-size: 1.15rem;
            padding: 18px;
            border-radius: 14px;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="card">
        <div class="stats">
            <span>总题数: <b id="totalCount">0</b></span>
            <span>剩余待抽: <b id="remainCount">0</b></span>
        </div>

        <div class="word-box">
            <div id="wordDisplay" class="current-word empty-hint">准备就绪，点击抽题</div>
        </div>

        <div class="btn-group">
            <div class="btn-row">
                <button id="drawBtn" class="btn btn-primary" onclick="drawNextWord()">🎯 下一道题</button>
                <button id="resetBtn" class="btn btn-secondary" onclick="confirmResetPool()">🔄 重置</button>
            </div>
            <button class="btn btn-fullscreen" onclick="enterFullscreen()">⛶ 进入全屏模式</button>
        </div>
    </div>

    <div class="card">
        <details>
            <summary>⚙️ 自定义题库设置</summary>
            <p class="tip-text" style="margin-top: 10px;">每行输入一个词语，修改后点击保存：</p>
            <textarea id="wordInput" class="textarea-box" placeholder="例如：&#10;奥特曼&#10;西瓜&#10;奶茶"></textarea>
            <button class="btn btn-primary" style="width: 100%; font-size: 0.95rem; padding: 10px;" onclick="saveCustomWords()">💾 保存题库</button>
            <div id="saveMsg" class="save-msg">✓ 题库保存成功！</div>
        </details>
    </div>
</div>

<!-- 全屏界面 -->
<div class="fullscreen-overlay" id="fullscreenOverlay">
    <div class="fs-header">
        <div>剩余: <b id="fsRemainCount">0</b> / <span id="fsTotalCount">0</span></div>
        <button class="fs-exit-btn" onclick="exitFullscreen()">✕ 退出全屏</button>
    </div>

    <div class="fs-word-area">
        <div id="fsWordDisplay" class="fs-word fs-hint">准备就绪</div>
    </div>

    <div class="fs-controls">
        <button id="fsDrawBtn" class="btn fs-btn-next" onclick="drawNextWord()">下一题 ➔</button>
        <button class="btn fs-btn-reset" onclick="confirmResetPool()">🔄 重置</button>
    </div>
</div>

<script>
    var defaultWords = [
        "奥特曼", "珍珠奶茶", "吃鸡", "过山车", "仙人掌",
        "蒙娜丽莎", "打瞌睡", "皮卡丘", "火锅", "羽毛球",
        "小猪佩奇", "蓝牙耳机", "做核酸", "孙悟空", "爆米花"
    ];

    var fullPool = [];
    var currentPool = [];
    var currentWord = "";

    function init() {
        try {
            var saved = localStorage.getItem("draw_guess_words");
            if (saved) {
                fullPool = JSON.parse(saved);
            } else {
                fullPool = defaultWords.slice();
                localStorage.setItem("draw_guess_words", JSON.stringify(fullPool));
            }
        } catch (e) {
            fullPool = defaultWords.slice();
        }

        var inputEl = document.getElementById("wordInput");
        if (inputEl) {
            inputEl.value = fullPool.join("\n");
        }
        resetPool();
    }

    function drawNextWord() {
        if (currentPool.length === 0) return;

        var randomIndex = Math.floor(Math.random() * currentPool.length);
        currentWord = currentPool.splice(randomIndex, 1)[0];

        renderWord();
        updateStats();

        if (currentPool.length === 0) {
            document.getElementById("drawBtn").disabled = true;
            document.getElementById("fsDrawBtn").disabled = true;
            document.getElementById("drawBtn").innerText = "题目已抽完";
            document.getElementById("fsDrawBtn").innerText = "已抽完";
        }
    }

    function confirmResetPool() {
        if (currentPool.length < fullPool.length && currentPool.length > 0) {
            if (!confirm("确定要重置题库重新洗牌吗？")) return;
        }
        resetPool();
    }

    function resetPool() {
        currentPool = fullPool.slice();
        currentWord = "";

        document.getElementById("drawBtn").disabled = (fullPool.length === 0);
        document.getElementById("fsDrawBtn").disabled = (fullPool.length === 0);
        document.getElementById("drawBtn").innerText = "🎯 下一道题";
        document.getElementById("fsDrawBtn").innerText = "下一题 ➔";

        renderWord();
        updateStats();
    }

    function renderWord() {
        var wordEl = document.getElementById("wordDisplay");
        var fsWordEl = document.getElementById("fsWordDisplay");

        if (fullPool.length === 0) {
            wordEl.className = "current-word empty-hint";
            wordEl.innerText = "请在下方添加题库";
            fsWordEl.className = "fs-word fs-hint";
            fsWordEl.innerText = "请先添加题库";
        } else if (!currentWord) {
            wordEl.className = "current-word empty-hint";
            wordEl.innerText = "准备就绪，点击抽题";
            fsWordEl.className = "fs-word fs-hint";
            fsWordEl.innerText = "准备就绪";
        } else {
            wordEl.className = "current-word";
            wordEl.innerText = currentWord;
            fsWordEl.className = "fs-word";
            fsWordEl.innerText = currentWord;
        }
    }

    function updateStats() {
        document.getElementById("totalCount").innerText = fullPool.length;
        document.getElementById("remainCount").innerText = currentPool.length;
        document.getElementById("fsTotalCount").innerText = fullPool.length;
        document.getElementById("fsRemainCount").innerText = currentPool.length;
    }

    function saveCustomWords() {
        var text = document.getElementById("wordInput").value;
        var lines = text.split("\n");
        var words = [];
        for (var i = 0; i < lines.length; i++) {
            var item = lines[i].trim();
            if (item.length > 0) words.push(item);
        }

        if (words.length === 0) {
            alert("题库不能为空！");
            return;
        }

        fullPool = words;
        try {
            localStorage.setItem("draw_guess_words", JSON.stringify(fullPool));
        } catch (e) {}

        resetPool();

        var msgEl = document.getElementById("saveMsg");
        msgEl.style.display = "block";
        setTimeout(function() {
            msgEl.style.display = "none";
        }, 2000);
    }

    // 真正的硬件级全屏调用 + UI 遮罩展示
    function enterFullscreen() {
        var overlay = document.getElementById("fullscreenOverlay");
        overlay.style.display = "flex";

        // 尝试调用系统的真正全屏 API（安卓 Chrome、PC 浏览器会隐藏地址栏）
        var elem = document.documentElement;
        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(function(){});
        } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
        }
    }

    // 退出全屏
    function exitFullscreen() {
        var overlay = document.getElementById("fullscreenOverlay");
        overlay.style.display = "none";

        if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(function(){});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }

    // 监听返回键或物理退出
    document.addEventListener("fullscreenchange", function() {
        if (!document.fullscreenElement) {
            document.getElementById("fullscreenOverlay").style.display = "none";
        }
    });

    window.onload = init;
</script>
</body>
</html>
